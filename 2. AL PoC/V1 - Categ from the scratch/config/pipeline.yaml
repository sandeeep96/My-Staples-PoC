# Pipeline settings: thresholds, weights, models. Method: methodology.md (Phase 2 changes in §14).
# Everything tunable lives here, not in code.

paths:
  raw_dir: Excels
  interim_dir: data/interim
  cache_dir: data/cache
  out_dir: outputs

encoder:
  default: BAAI/bge-small-en-v1.5
  candidates: [BAAI/bge-small-en-v1.5, BAAI/bge-base-en-v1.5]   # bake-off on mapping (S2)
  bakeoff: true
  batch_size: 64

families:
  # competitor variants (same brand + same name stem) merge only when their descriptions also start the same:
  # house-brand titles are generic ("Metal Desk Lamp"), so the name alone would merge different products
  competitor_desc_prefix: 80

extraction:
  # "rules": local vocabulary + embedding zero-shot instrument (no API key needed).
  # "claude": LLM instrument (methodology §6.2); needs ANTHROPIC_API_KEY. Not wired yet.
  backend: rules
  style_zero_shot: true            # default; a node config can switch it off (non-furniture nodes)
  style_zero_shot_margin: 0.015
  desc_words_in_card: 40
  # Text parity (same instrument, same amount of text): for text-measured fields, Staples text is cut to the
  # median description length of that node's competitor. Staples-only nodes use the default.
  parity_default_chars: 400
  parity_min_chars: 80
  parity_max_chars: 1500

nodes:
  min_families_scored: 30          # per side, else the node is "thin" (descriptive only)

mapping:
  k: 15
  affinity_top: 5
  low_conf_prob: 0.6
  # NONE threshold: Youden-J between known in-scope and known out-of-scope products, but never rejecting more
  # than (1 - min_in_scope_recall) of the known in-scope products. The page crosswalk already removes whole
  # out-of-scope pages; the product check only has to catch mis-shelved items.
  min_in_scope_recall: 0.95
  auto_candidates: 3               # pages missing from the crosswalk: top-n Staples nodes by name similarity

archetypes:
  core_facets: 4                   # every archetype is defined by at least 4 attributes ...
  max_facets: 6                    # ... and at most 6 (refinement adds the 5th/6th only where support allows)
  max_archetypes: 40               # refinement stops before a node exceeds this many archetypes
  tier_min: {tier1: 1, tier2: 1, tier3: 1}   # the 4 core attributes mix all three tiers
  max_unknown_share: 0.4
  max_dominant_share: 0.85         # a facet whose top value covers more families than this says little
  exclusive_facets: [[colour_tone, colour_family]]   # never both in one archetype (same information)
  require_type_facet: true         # the core includes the node's product-type attribute when it is usable
  min_pooled: 10
  # a cell is supported with >= 10 pooled families and enough families on at least one side; each side's bar scales
  # with that side's size, so a 3,000-family competitor sample does not swamp a 100-family Staples node
  min_competitor: 5
  min_competitor_share: 0.005      # competitor bar = max(min_competitor, 0.5% of the node's competitor families)
  min_staples: 8
  min_staples_share: 0.04          # Staples bar = max(min_staples, 4% of the node's Staples families)
  # if fewer than core_facets candidates pass every check, the best near-misses are admitted (skewed first, then
  # partly unknown, then below the validation bar) and flagged in the report, so every archetype keeps 4 attributes
  admit_near_misses: true
  rare_value_share: 0.05           # facet values held by < 5% of the node's families are grouped as "other"
  entropy_weight: 0.25             # score = balanced coverage + weight x mean normalised entropy
  price_bands: 4                   # node price bands: price insights only, never an archetype attribute
  umap_components: 10
  bootstrap: 20

vector:
  k_whitespace: 15
  aas_top: 50
  crs_top: 3
  identical_cos: 0.95
  identical_log_price: 0.15
  crs_high: 70
  crs_low: 30
  aas_low_pct: 10                  # percentile of Staples' own AAS
  aas_high_pct: 35
  ad_threshold: 0.5
  ppr_undercut: 0.85
  ppr_tradeup: 1.5
  dfi_delta_tradeup: 0.15
  gamma: 1.0
  vos_weights: {vw: 0.45, aas: 0.30, ad: 0.25}
  calib_pairs: 3000

gaps:
  credible: 0.9
  noncredible_shrink: 0.5
  dfi_forward: 0.6
  min_side_for_within: 3
  tg_weights: {lsr: 0.35, ppg: 0.20, cg: 0.15, msg: 0.15, dfg: 0.15}
  original_tg_weights: {lsr: 0.35, ppg: 0.25, cg: 0.20, dfg: 0.20}
  mc_draws: 20000

integration:
  w_vos: 0.5                        # fused rank (ordering only): Final = w_vos * rank(VOS) + w_tg * rank(TG)
  w_tg: 0.5
  rrf_k: 60

# Safety gates (Phase 2, Sai 2026-10-01; methodology §14.6). Common gates up to the archetypes, then one gate per
# method on that method's own scores (each with its own cannibalisation check), then one final gate.
gates:
  common:
    min_competitor_families: 5      # C2 valid archetype: >= 4 attributes, nameable (no "other"), enough competitor products
  method1:                          # M1: product labels from CRS / PPR / AAS / AD
    lean_approve: true              # REVIEW with AD >= ad_threshold and AAS >= T_high counts as safe (methodology §6.6)
    min_safe_products: 2
    min_safe_share: 0.10            # safe / decided (non-REVIEW) products
    max_reject_share: 0.70          # (SUBSTITUTE + UNDERCUT) / all products
    top_n: 10                       # per node, by VOS
  method2:                          # M2: ACR (Attribute Cannibalisation Risk) from attribute twins + price
    min_credibility: 0.9            # competitor credibly over-indexes (LSR credibility), or the archetype is absent at Staples
    max_acr: 0.50
    min_ok_products: 2              # products that are not attribute undercuts / substitutes
    twin_min_attrs: 2               # a twin needs >= 2 known functional attributes, all equal
    undercut_ppr: 0.85              # price / twins' median price
    tradeup_ppr: 1.5
    top_n: 10                       # per node, by TG
  final:
    min_per_node: 3                 # below this, a labelled "Conditional" fill
    max_per_node: 10

sensitivity:
  draws: 1000
  alpha_scale: 20
  top_n: 5

skus:
  n_exemplars: 3
  mmr_lambda: 0.7
  style_extension_n: 5

qa:
  g1_leaf_acc: 0.90               # Staples leave-one-out k-NN node accuracy
  g1_none_bal: 0.85               # NONE decision, balanced accuracy on known in/out-of-scope products
  g2_field_acc: 0.85
  g5_max_source_auc: 0.80         # retailer predictability from the source-neutral card
  g6_ari: 0.4
  g6_stability: 0.6
  g7_topn_stability: 0.70
  g7_auc: 0.80
  g8_data_error: 0.02

report:
  title: "Staples: Assortment Gap & Recommendation Analysis - Archetype"
  file_stem: Staples_Assortment_Report   # each build writes <stem>_v<N>.html, N = previous highest + 1
