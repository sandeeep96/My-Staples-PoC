size_bands: {source: diameter, bands: {"small (<10 in)": ['0', '10'], "medium (10-14 in)": ['10', '14.5'], "large (14-20 in)": ['14.5', '20.5'], "oversized (20 in+)": ['20.5', '1000']}}

