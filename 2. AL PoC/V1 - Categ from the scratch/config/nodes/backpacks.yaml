reviewed_by: null

material_spec_keys: ['Backpack Material']
style_zero_shot: false
vocab_overrides:
  material_class:
    mode: position
    values:
      faux leather: ['faux leather', 'pu leather', 'vegan leather', 'leatherette', 'polyurethane', 'pu']
      leather: ['genuine leather', 'full[- ]grain', 'top[- ]grain', 'real leather', 'leather']
      nylon: ['nylon', 'rip[- ]?stop', 'cordura', 'ballistic']
      polyester: ['polyester', 'recycled polyester', '\d{3,4}d', 'oxford', 'fabric', 'microfiber']
      canvas/cotton: ['canvas', 'cotton', 'waxed']
      clear/vinyl: ['clear', 'transparent', 'pvc', 'vinyl', 'mesh']

tier2:
  pack_type:
    mode: priority
    values:
      rolling: ['rolling', 'wheels?', 'wheeled', 'trolley']
      hiking/outdoor: ['hiking', 'trekking', 'camping', 'trail', 'hydration', 'outdoor', 'climbing', 'daypack']
      travel/carry-on: ['travel', 'carry[- ]on', 'airline', 'flight approved', 'personal item', 'weekender', 'duffel']
      school/kids: ['school', 'kids', 'book ?bag', 'book ?pack', 'toddler', 'preschool', 'children', 'boys?', 'girls?']
      mini/sling: ['mini', 'sling', 'crossbody', 'convertible', 'purse']
      laptop/work: ['laptop', 'business', 'work', 'commut\w+', 'computer', 'office']
  water_resistant:
    mode: priority
    values: {"yes": ['water[- ]?(resistant|proof|repellent)']}
    spec_keys: ['Waterproof or Water Resistant']
    spec_map: {Water Resistant: "yes", Waterproof: "yes"}
  usb_port:
    mode: priority
    values: {"yes": ['usb', 'charging port']}
  anti_theft:
    mode: priority
    values: {"yes": ['anti[- ]theft', 'rfid', 'lockable', 'tsa']}

numeric:
  laptop_in:
    spec_keys: ['Laptop Size Compatibility']
    text_regex: ['(\d{2}(?:\.\d)?)\s*(?:"|”|''''|-?\s?inch(?:es)?\b|in\b)[^.|]{0,25}?laptop', 'laptop[^.|]{0,25}?(\d{2}(?:\.\d)?)\s*(?:"|”|-?\s?inch|in\b)', 'fits?[^.|]{0,20}?(\d{2}(?:\.\d)?)\s*(?:"|”|-?\s?inch)']
    min: 10
    max: 19
  capacity_l:
    spec_keys: ['Capacity (liters)']
    text_regex: ['(\d{1,2})\s*(?:l|liters?|litres?)\b']
    min: 5
    max: 70
numeric_bands:
  laptop_fit: {source: laptop_in, bands: {"up to 14 in": ['0', '14.95'], "15-16 in": ['14.95', '16.95'], "17 in+": ['16.95', '30']}}
  capacity_band: {source: capacity_l, bands: {"up to 20 L": ['0', '20.5'], "21-30 L": ['20.5', '30.5'], "31 L+": ['30.5', '100']}}
size_bands: null

tier3:
  pattern:
    mode: priority
    spec_keys: ['Backpack Pattern']
    default: solid
    values:
      character/licensed: ['disney', 'marvel', 'harry potter', 'star wars', 'pok[eé]mon', 'minecraft', 'sanrio', 'hello kitty', 'bluey', 'paw patrol', 'frozen', 'spider-?man', 'mickey', 'pixar', 'barbie', 'sonic', 'super mario', 'licensed']
      camo: ['camo\w*']
      floral: ['floral', 'flowers?', 'botanical']
      novelty/animal: ['unicorn', 'dinosaur', 'shark', 'animal', 'novelty', 'costume', 'snail', 'cat ears']
      print/pattern: ['print', 'pattern', 'plaid', 'geometric', 'tie[- ]dye', 'stripes?', 'polka', 'graphic', 'artwork', 'heathered']
  audience:
    mode: priority
    spec_keys: ['Age Group']
