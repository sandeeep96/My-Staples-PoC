    values:
      kids: ['kids', 'children', 'toddler', 'preschool', 'youth', 'boys?', 'girls?', 'elementary']
      women: ['women', "women's", 'womens', 'ladies']
      men: ["\\bmen\\b", "men's", '\bmens\b']

